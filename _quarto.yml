website:
  title: "ECOTOPIA"
  description: "The Last Sustainable Utopia — Sanctuary De Warren, Nov 28, 2026"
  favicon: "assets/favicon.ico"
  navbar:
    background: "#0a140a"
    foreground: "#4aad4a"
    logo: "assets/logo.svg"
    title: "ECOTOPIA"
    left:
      - text: "HOME"
        href: index.qmd
      - text: "THE 4 EPOCHS"
        href: lore.qmd
      - text: "10 MINISTRIES"
        href: manifesto.qmd
      - text: "ADMISSION & QUIZ"
