<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Outer Rim -->
  <circle cx="100" cy="100" r="94" fill="none" stroke="#000" stroke-width="7"/>
  <!-- Inner Rim Framing Center Icon -->
  <circle cx="100" cy="100" r="56" fill="none" stroke="#000" stroke-width="3"/>

  <!-- Circular Text -->
  <path id="textPathTop" d="M 28 100 A 72 72 0 0 1 172 100" fill="none"/>
  <text font-family="monospace, sans-serif" font-size="14" font-weight="900" letter-spacing="2.5" fill="#000">
    <textPath href="#textPathTop" startOffset="50%" text-anchor="middle">MINITHRIFT</textPath>
  </text>
  
  <path id="textPathBottom" d="M 172 100 A 72 72 0 0 1 28 100" fill="none"/>
  <text font-family="monospace, sans-serif" font-size="11.5" font-weight="900" letter-spacing="2" fill="#000">
    <textPath href="#textPathBottom" startOffset="50%" text-anchor="middle">MATERIAL LIBERATION</textPath>
  </text>

  <!-- Center Icon: Confiscation Shears & Open Shackle -->
  <path d="M87 96 V83 A13 13 0 0 1 113 83 V92" fill="none" stroke="#000" stroke-width="7" stroke-linecap="round"/>
  <rect x="80" y="96" width="40" height="30" rx="4" fill="#000"/>
  <circle cx="100" cy="108" r="4" fill="#fff"/>
  <rect x="98.5" y="108" width="3" height="9" fill="#fff"/>
  
  <!-- Shears cutting across (scaled to r<=45) -->
  <line x1="73" y1="75" x2="93" y2="95" stroke="#000" stroke-width="5" stroke-linecap="round"/>
  <line x1="73" y1="95" x2="93" y2="75" stroke="#000" stroke-width="5" stroke-linecap="round"/>
  <circle cx="70" cy="72" r="4.5" fill="none" stroke="#000" stroke-width="3"/>
  <circle cx="70" cy="98" r="4.5" fill="none" stroke="#000" stroke-width="3"/>
</svg>
