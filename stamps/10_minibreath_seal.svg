<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Outer Rim -->
  <circle cx="100" cy="100" r="94" fill="none" stroke="#000" stroke-width="7"/>
  <!-- Inner Rim Framing Center Icon -->
  <circle cx="100" cy="100" r="56" fill="none" stroke="#000" stroke-width="3"/>

  <!-- Circular Text -->
  <path id="textPathTop" d="M 28 100 A 72 72 0 0 1 172 100" fill="none"/>
  <text font-family="monospace, sans-serif" font-size="14" font-weight="900" letter-spacing="2.5" fill="#000">
    <textPath href="#textPathTop" startOffset="50%" text-anchor="middle">MINIBREATH</textPath>
  </text>
  
  <path id="textPathBottom" d="M 172 100 A 72 72 0 0 1 28 100" fill="none"/>
  <text font-family="monospace, sans-serif" font-size="11" font-weight="900" letter-spacing="2" fill="#000">
    <textPath href="#textPathBottom" startOffset="50%" text-anchor="middle">ATMOSPHERIC RECTITUDE</textPath>
  </text>

  <!-- Center Icon: Spirometry Turbine / Pinwheel -->
  <circle cx="100" cy="100" r="9" fill="#000"/>
  <!-- 4 Turbine Blades -->
  <path d="M100 100 L95 72 L108 72 Z" fill="#000"/>
  <path d="M100 100 L128 95 L128 108 Z" fill="#000"/>
  <path d="M100 100 L105 128 L92 128 Z" fill="#000"/>
  <path d="M100 100 L72 105 L72 92 Z" fill="#000"/>
  <!-- Exhalation Wave Arcs -->
  <path d="M68 84 Q82 68 100 68" fill="none" stroke="#000" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M132 116 Q118 132 100 132" fill="none" stroke="#000" stroke-width="3.5" stroke-linecap="round"/>
</svg>
